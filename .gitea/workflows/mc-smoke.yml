# MIRROR — do not edit here. Canonical source: .github/workflows/mc-smoke.yml
# Edit the .github copy, then copy it verbatim to this path (only this header differs).
name: CI — Tier 2 (MC runServer smoke)

# Why this workflow is separate from Tier-1 (ci.yml):
#   Minecraft dev servers pull the MC toolchain (~200 MB), assets, and mappings.
#   Full boot-to-first-tick is 3–10 min wall time. We run it on push-to-main and
#   nightly, not on every PR, so unit-level signal stays fast.
#
# Coverage goals:
#   1. NeoForge adapter boots MC 1.21.1 to first tick through mcdepprovider,
#      and prints its [mcdp-smoke] marker (so "MC booted" cannot pass for "mcdp ran").
#   2. Fabric adapter, same.
#   3. Second boot is served entirely from the cache the first boot populated —
#      every library line reads "(cached)", none reports a byte size.
#
# NOT a goal here, deliberately: ADR-0007 dev-mode classpath parity. ADR-0025 reversed
# `patchRunTasks` to opt-in and neither smoke mod opts in, so there is nothing to assert
# on these classpaths. A step claiming to check it lived here for a long time and never
# ran once -- it invoked a `:runServerClasspath` task that exists nowhere in the repo,
# swallowed the failure with `||`, then guarded its assertion on a file that was
# therefore never written. The opt-in path is covered by
# McdpProviderPluginTest.stripsManifestJarsFromRunTaskClasspath, which asserts the
# patched classpath itself rather than the strip-count log line.
#
# Cache policy:
#   - Gradle home YES (per-OS, keyed on libs.versions.toml + *.gradle.kts).
#   - MC assets cache YES (per-OS, per-MC-version key).
#   - ~/.cache/mcdepprovider NO — the offline-boot step needs to populate it
#     from the real download path within the same job. Caching across jobs
#     would hide download regressions.

on:
  push:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC — after most PRs merge, before the workday starts.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: mc-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runserver-smoke:
    strategy:
      fail-fast: false
      matrix:
        # Linux catches most. Windows catches path + hard-link issues specific to
        # the LibraryCache (ADR-0006). macOS is out — no additional coverage for
        # a pure-JVM project whose platform surface is the cache dir.
        os: [ubuntu-latest, windows-latest]
        platform:
          - { name: neoforge, dir: test-mods/neoforge-example, modid: neoforge_example }
          - { name: fabric,   dir: test-mods/fabric-example,   modid: fabric_example   }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts', 'settings.gradle.kts', '*/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Minecraft assets (${{ matrix.platform.name }})
        uses: actions/cache@v4
        with:
          # ModDevGradle stashes MC assets under ~/.neoforge; Loom under ~/.gradle/caches/fabric-loom.
          # Both benefit from per-OS caching — MC's asset manifest is ~200 MB and stable per MC version.
          path: |
            ~/.neoforge
            ~/.gradle/caches/fabric-loom
          key: mc-assets-${{ runner.os }}-${{ matrix.platform.name }}-1.21.1
          restore-keys: |
            mc-assets-${{ runner.os }}-${{ matrix.platform.name }}-

      - name: Build mcdepprovider (publishes to composite build for test-mods)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Generate manifest (${{ matrix.platform.name }})
        working-directory: ${{ matrix.platform.dir }}
        run: ../../gradlew generateMcdpManifest --no-daemon --stacktrace

      - name: Assert manifest has Scala + cats + circe with valid SHAs
        shell: bash
        run: |
          set -euo pipefail
          M="${{ matrix.platform.dir }}/build/mcdepprovider/META-INF/mcdepprovider.toml"
          test -f "$M" || { echo "manifest not at $M"; exit 1; }
          grep -q 'cats-kernel_3' "$M" || { echo "cats-kernel_3 missing"; cat "$M"; exit 1; }
          grep -q 'scala3-library_3' "$M" || { echo "scala3-library_3 missing"; cat "$M"; exit 1; }
          grep -q 'circe-core_3' "$M" || { echo "circe-core_3 missing"; cat "$M"; exit 1; }
          grep -qE 'sha256 = "[0-9a-f]{64}"' "$M" || { echo "no valid sha256 lines"; cat "$M"; exit 1; }

      - name: First boot — online, populates mcdepprovider cache
        working-directory: ${{ matrix.platform.dir }}
        run: |
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 900 \
            --log-file ../../smoke-${{ matrix.platform.name }}-${{ runner.os }}-boot1.log
        shell: bash

      - name: Assert mcdp actually loaded the mod (first boot)
        # Without this the job proves only that Minecraft started. It is the sole Tier-2 job
        # that runs on push, so it is the one `publish.yml`'s gate reads — it has to be able
        # to tell "mcdp loaded the mod" from "MC booted and mcdp did nothing".
        shell: bash
        run: |
          set -euo pipefail
          LOG=smoke-${{ matrix.platform.name }}-${{ runner.os }}-boot1.log
          # These two mods print the ADR-0001 isolation line (mod=<id> name=... cats...),
          # not the bands' "boot ok" marker. Match the mod= prefix, which both shapes share.
          grep -q "\[mcdp-smoke\] mod=${{ matrix.platform.modid }} " "$LOG" || {
            echo "ERROR: mcdp smoke marker for ${{ matrix.platform.modid }} not in log"
            grep '\[mcdp-smoke\]' "$LOG" || true
            exit 1
          }

      - name: Assert the NeoForge mixin-bridge path ran (neoforge only)
        # All four NeoForge bands parse [[mixins]] out of neoforge.mods.toml and feed
        # MixinConfigScanner, and until this mod gained a mixin that code had never run against a
        # real config on any band. The mixin fires inside Blocks.<clinit>, before FML's loadMod
        # sweep, so the marker also proves the lazy bridge populator resolved on demand.
        #
        # NeoForge registers the config from the TOML alone -- no jar-manifest attribute and no
        # --mixin.config, which is the sharp contrast with the Forge twin in the bands job.
        if: matrix.platform.name == 'neoforge'
        shell: bash
        run: |
          set -euo pipefail
          LOG=smoke-${{ matrix.platform.name }}-${{ runner.os }}-boot1.log
          grep -q '\[mcdp-smoke\] mixin=BlocksClinitMixin mod=neoforge_example ok' "$LOG" || {
            echo "ERROR: NeoForge mixin marker missing — the bridge did not resolve"
            grep '\[mcdp-smoke\]' "$LOG" || true
            exit 1
          }

      - name: Second boot — must be served entirely from cache
        working-directory: ${{ matrix.platform.dir }}
        shell: bash
        run: |
          python3 ../../scripts/mc_smoke.py             --cwd .             --task :runServer             --timeout 600             --log-file ../../smoke-${{ matrix.platform.name }}-${{ runner.os }}-boot2.log

      - name: Assert the second boot downloaded nothing
        # The real cache assertion, and the reason ci.yml deliberately does not cache
        # ~/.cache/mcdepprovider across jobs. LoggingProgressListener prints one line per
        # library: "(cached)" when served from the cache, a byte size when fetched. After a
        # complete first boot every line must be "(cached)".
        #
        # The first grep is the anti-vacuous guard: if no resolve lines are present at all,
        # the download check below would pass without proving anything.
        shell: bash
        run: |
          set -euo pipefail
          LOG=smoke-${{ matrix.platform.name }}-${{ runner.os }}-boot2.log
          RESOLVED=$(grep -cE 'mcdp\[[^]]+\]: \([0-9]+/[0-9]+\)' "$LOG" || true)
          echo "mcdp library-resolution lines on second boot: $RESOLVED"
          [ "$RESOLVED" -gt 0 ] || {
            echo "ERROR: no mcdp library resolution happened at all — nothing was verified"
            exit 1
          }
          if grep -E 'mcdp\[[^]]+\]: \([0-9]+/[0-9]+\) .* [0-9.]+ (B|KB|MB)$' "$LOG"; then
            echo "ERROR: the above libraries were downloaded on the second boot;"
            echo "the first boot's cache is incomplete, so ADR-0006 cache reuse is broken."
            exit 1
          fi
          echo "all $RESOLVED libraries served from cache"

      - name: Upload MC logs + crash reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mc-smoke-${{ matrix.platform.name }}-${{ runner.os }}
          path: |
            smoke-*.log
            ${{ matrix.platform.dir }}/run/logs/**
            ${{ matrix.platform.dir }}/run/crash-reports/**
            ${{ matrix.platform.dir }}/build/reports/**
            ${{ matrix.platform.dir }}/build/mcdepprovider/META-INF/*.toml
          if-no-files-found: ignore

      - name: Upload boot logs on success (for trend analysis)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mc-smoke-success-${{ matrix.platform.name }}-${{ runner.os }}
          path: |
            smoke-*.log
          if-no-files-found: ignore
          retention-days: 14

  # Per-band runServer smoke (ADR-0023).
  #
  # The multi-MC-band restructure ships EIGHT bands of Fabric/NeoForge/Forge adapters:
  # 1.17, 1.18, 1.19, 1.20, 1.20.6, 1.21, 1.21.11 and 26. (`mcdp-26.1` no longer exists —
  # ADR-0032 collapsed the whole calendar line into one `mcdp-26` band.)
  # `runserver-smoke` above only covers MC 1.21.1; a regression in any per-band SPI
  # port (Forge 4.0 vs 6.0 vs 7.x, NeoForge 8.0.x vs 9.0.x vs 10.x, fabric-loader 0.14
  # vs 0.15 vs 0.19) would not surface until release. This job boots one test mod per
  # (loader × band) cell.
  #
  # COVERED: every band, on every loader that band supports -- 14 cells x 2 OSes.
  # The only mod in test-mods/ without a cell here is mixin-example, which has its own job
  # (mixin-codegen-smoke) because it asserts on codegen output rather than on a boot.
  #
  # Two cells need a non-default daemon JVM, via the daemon_jdk column:
  #   - forge-1.17 runs a Gradle 7.6 wrapper (1.17.1 is the one MC version Forge never
  #     regenerated an FG6 MDK for), which cannot run on JDK 21 -> daemon 17, toolchain 16.
  #   - the two 26.x mods carry their own Gradle 9.7.1 wrapper and need a JDK 25 daemon:
  #     Loom refuses a MC version whose required Java exceeds the daemon JVM, and Loom 1.18.x
  #     declares org.gradle.plugin.api-version 9.7.0 so 9.6.x is rejected at variant selection.
  # Everything else builds on the repo-root Gradle 8.11.1 wrapper and the JDK 21 daemon.
  #
  # The root wrapper must NOT be bumped past Gradle 8: ForgeGradle 6.0.54 accepts [8.1, 9.0)
  # and forge-example-1.19/-1.20 composite-include the root build.
  #
  # Triggers: nightly only (no push), so a band regression cannot block a snapshot publish on
  # the day it lands -- the base 1.21 smoke above stays on push for PR signal. Cells run in
  # parallel, so wall time is roughly one cell; steady state is ~1 min publish + 2-4 min
  # boot-to-first-tick each. timeout-minutes is a backstop, not a budget.

  runserver-smoke-bands:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        cell:
          # Each cell: dir = test mod root; modid = expected [mcdp-smoke] mod ID;
          # cache_key = MC version key; loader = fabric|neoforge|forge (which cache
          # paths to populate); daemon_jdk = JDK the *test mod's* Gradle build must run
          # on, empty = use the job default (21). Only the MC 26.x band needs an override
          # (its own Gradle 9.7.1 wrapper on a JDK 25 daemon); every other cell, including
          # forge-1.18 since it moved to ForgeGradle 6, runs on the default daemon and gets
          # any older Java it needs as a *toolchain*.
          #
          # There is no needs_eula field any more: mc_smoke.py writes run/eula.txt=true
          # itself for every cell, unconditionally. The old flag was also the reason the
          # Fabric cells looked green without reaching first tick (see the note above).
          - { name: fabric-1.17,    dir: test-mods/fabric-example-1.17,    modid: fabric_example_117,    cache_key: 1.17.1, loader: fabric,   daemon_jdk: "" }
          - { name: fabric-1.18,    dir: test-mods/fabric-example-1.18,    modid: fabric_example_118,    cache_key: 1.18.2, loader: fabric,   daemon_jdk: "" }
          - { name: fabric-1.20,    dir: test-mods/fabric-example-1.20,    modid: fabric_example_120,    cache_key: 1.20.1, loader: fabric,   daemon_jdk: "" }
          - { name: fabric-1.20.6,  dir: test-mods/fabric-example-1.20.6,  modid: fabric_example_1206,   cache_key: 1.20.6, loader: fabric,   daemon_jdk: "" }
          - { name: neoforge-1.20.6,dir: test-mods/neoforge-example-1.20.6,modid: neoforge_example_1206, cache_key: 1.20.6, loader: neoforge, daemon_jdk: "" }
          - { name: forge-1.20,     dir: test-mods/forge-example-1.20,     modid: forge_example_120,     cache_key: 1.20.1, loader: forge,    daemon_jdk: "" }
          - { name: fabric-1.19,    dir: test-mods/fabric-example-1.19,    modid: fabric_example_119,    cache_key: 1.19.2, loader: fabric,   daemon_jdk: "" }
          - { name: forge-1.19,     dir: test-mods/forge-example-1.19,     modid: forge_example_119,     cache_key: 1.19.2, loader: forge,    daemon_jdk: "" }
          # 1.21.11 uses Mojang's official mappings, not yarn: Loom 1.9 (the newest line the
          # root Gradle 8.11.1 wrapper supports) cannot read 1.21.11's yarn unpick metadata.
          - { name: fabric-1.21.11, dir: test-mods/fabric-example-1.21.11, modid: fabric_example_12111,  cache_key: 1.21.11, loader: fabric,   daemon_jdk: "" }
          - { name: neoforge-1.21.11,dir: test-mods/neoforge-example-1.21.11,modid: neoforge_example_12111,cache_key: 1.21.11, loader: neoforge, daemon_jdk: "" }
          # MC 1.18.2. Ordinary composite-included mod on ForgeGradle 6 / the root Gradle
          # 8.11.1 wrapper — the official 1.18.2 MDK is FG6 (`[6.0,6.2)`) with a Gradle 8.8
          # wrapper, so there was never anything to isolate. Runs on the default JDK 21
          # daemon; its `toolchain { languageVersion = 17 }` is satisfied from
          # JAVA_HOME_17_X64, which is why 17 stays in the setup-java list below.
          - { name: forge-1.18,     dir: test-mods/forge-example-1.18,     modid: forge_example_118,     cache_key: 1.18.2, loader: forge,    daemon_jdk: "" }
          # The last band to get a cell. The repo said in five places that this one could not have
          # one because "GitHub runners ship no JDK 16" -- but Adoptium publishes jdk-16.0.2+7 GA,
          # setup-java installs it, and the mod only needs 16 as a *toolchain*: it runs a Gradle 7.6
          # wrapper, so the daemon is 17. Verified by building and booting it locally first.
          - { name: forge-1.17,     dir: test-mods/forge-example-1.17,     modid: forge_example_117,     cache_key: 1.17.1, loader: forge,    daemon_jdk: "17" }
          # MC 26.x band. Own Gradle 9.7.1 wrapper, no includeBuild("../.."), consumes
          # mcdp + the mcdp gradle-plugin from mavenLocal (the preflight step below).
          # The only band left with its own distribution. Needs the JDK 25 daemon: MC 26.x declares
          # javaVersion 25, Loom's MinecraftProvider#verifyJavaVersion checks it against
          # the *daemon* JVM, and Gradle 8.11.1 cannot run on JDK 25 anyway.
          # The 26.x rows need a JDK 25 daemon. MC 26.x ships deobfuscated, so the Fabric mod
          # maps through Fabric's identity intermediary (0.0.0) rather than yarn or Mojang
          # mappings — neither of which exists for the line, because neither is needed.
          - { name: fabric-26.3,   dir: test-mods/fabric-example-26.3,   modid: fabric_example_263,   cache_key: "26.3",   loader: fabric,   daemon_jdk: "25" }
          - { name: neoforge-26.2, dir: test-mods/neoforge-example-26.2, modid: neoforge_example_262, cache_key: "26.2",   loader: neoforge, daemon_jdk: "25" }
    runs-on: ${{ matrix.os }}
    # Backstop, not a budget. Measured real work is 3–5 min/cell; the sibling
    # `runserver-smoke` job (which does strictly more per job — full ./gradlew build plus
    # two boots) uses 45 and its slowest fully-cold cell ever measured was 11:46
    # (windows/neoforge, run 35465565854). 45 matches that job and leaves headroom for the
    # one genuinely unmeasured cost here: a cold ForgeGradle userdev/decompile setup, which
    # no run has ever completed because these cells were always cancelled first.
    # Note the script timeout below is deliberately lower (30 min) so a hang is reported as
    # a *failure* — cancelled jobs skip both the log upload and the actions/cache post-save.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDKs (21 default, 17 as a toolchain for the MC 1.18 cell, 25 for the MC 26.x band)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Multiple versions: setup-java installs each and exports JAVA_HOME_<major>_X64
          # for it. The LAST entry wins JAVA_HOME/PATH, so the repo build and every
          # Gradle-8 cell keep JDK 21 with no per-cell handling; the two 26.x cells pick
          # JAVA_HOME_25_X64 back up explicitly in the runServer step. 21 must stay LAST for
          # that reason. 17 is NOT a daemon JDK for anyone any more — it is there because
          # test-mods/forge-example-1.18 declares `toolchain { languageVersion = 17 }`, and a
          # JDK-21 daemon resolves that toolchain from JAVA_HOME_17_X64. Dropping 17 breaks
          # the forge-1.18 cell.
          java-version: |
            16
            17
            25
            21

      - name: Set up Python 3.12
        # scripts/mc_smoke.py runs the server and shuts it down on the first-tick marker.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts', 'settings.gradle.kts', '*/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Minecraft assets (${{ matrix.cell.loader }} ${{ matrix.cell.cache_key }})
        uses: actions/cache@v4
        with:
          # Loom (fabric) → ~/.gradle/caches/fabric-loom
          # ModDevGradle (neoforge) → ~/.neoforge
          # ForgeGradle (forge) → ~/.gradle/caches/forge_gradle
          #
          # Both Loom's and ForgeGradle's trees already sit under ~/.gradle/caches, which
          # the Gradle-home cache above restores wholesale; only ~/.neoforge is strictly
          # additive. They are still listed because this entry is keyed per loader+MC
          # version, so a band gets its MC artifacts back from a restore-key even when the
          # gradle-home key rotates on a build-file edit. Nothing here was ever actually
          # saved for the forge/neoforge cells: actions/cache's post-save step does not run
          # on a cancelled job, and those cells were cancelled every time. The mc_smoke.py
          # change below is what makes these caches start working.
          path: |
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/forge_gradle
            ~/.neoforge
          key: mc-assets-${{ runner.os }}-${{ matrix.cell.loader }}-${{ matrix.cell.cache_key }}
          restore-keys: |
            mc-assets-${{ runner.os }}-${{ matrix.cell.loader }}-

      - name: Publish mcdp aggregator + plugin to mavenLocal
        # The non-1.21 test mods consume mcdp-X via either composite-include
        # (fabric, neoforge bands) or mavenLocal (forge bands — see ADR-0023 for why).
        # Either way, publishing all aggregators + the gradle-plugin to mavenLocal first
        # is the simplest universal preflight.
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace
        shell: bash

      - name: runServer (${{ matrix.cell.name }})
        working-directory: ${{ matrix.cell.dir }}
        shell: bash
        # Same runner as the 1.21 cells above. mc_smoke.py spawns `gradlew :runServer`,
        # tails it, and terminates the whole process tree once MC prints its first-tick
        # marker — runServer itself has no self-exit flag, which is exactly why the plain
        # `gradlew runServer | tee` this replaced hung until timeout-minutes killed the job.
        # It also handles the three things the old inline version got wrong or not at all:
        #   * writes run/eula.txt=true for every cell, so Fabric cells reach first tick
        #     instead of halting at the EULA gate seconds after the mod initializer ran;
        #   * kills the forked MC JVM via process group / taskkill /T, so no orphan java
        #     process survives to hold run/world/session.lock (the cancelled jobs logged
        #     "Terminate orphan process: pid (java)" every time);
        #   * fails fast on NoClassDefFoundError / ResolutionException / "Invalid package
        #     name" rather than waiting out the timeout.
        # Wrapper selection is the script's own walk-up from --cwd: it uses the nearest
        # gradlew at or above the mod dir, so the two 26.x cells get their committed 9.7.1
        # wrapper and every other cell falls through to the repo-root 8.11.1. The script now refuses to run if a
        # mod pins a distribution but ships no launcher, which would silently use the root.
        # --timeout 1800 covers a cold ForgeGradle userdev/decompile setup, which happens
        # inside this single Gradle invocation, and stays under timeout-minutes: 45.
        run: |
          set -euo pipefail
          # Cells with their own Gradle distribution need their own daemon JDK: the MC 26.x
          # band runs Gradle 9.7.1 on JDK 25. Swap JAVA_HOME to the JDK this cell asked for;
          # mc_smoke.py inherits it through to the wrapper.
          JDK='${{ matrix.cell.daemon_jdk }}'
          if [ -n "$JDK" ]; then
            VAR="JAVA_HOME_${JDK}_X64"
            JH="${!VAR:-}"
            [ -n "$JH" ] || { echo "ERROR: $VAR not set by setup-java"; env | grep '^JAVA_HOME' || true; exit 1; }
            export JAVA_HOME="$JH"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 1800 \
            --log-file ../../smoke-${{ matrix.cell.name }}-${{ runner.os }}.log

      - name: Assert smoke marker fired
        shell: bash
        run: |
          set -euo pipefail
          LOG=smoke-${{ matrix.cell.name }}-${{ runner.os }}.log
          test -f "$LOG" || { echo "log missing"; exit 1; }
          grep -q "\[mcdp-smoke\] mod=${{ matrix.cell.modid }} boot ok" "$LOG" || {
            echo "ERROR: smoke marker for ${{ matrix.cell.modid }} not in log"
            grep '\[mcdp-smoke\]' "$LOG" || true
            exit 1
          }

      - name: Assert the NeoForge 1.20.6 mixin-bridge path ran (neoforge-1.20.6 only)
        # BlocksClinitMixin fires inside Blocks.<clinit>, before FML's loadMod sweep, so its
        # bridge resolves only through the adapter's lazy populator. That populator is where the
        # 1.20.6 adapter once called IModFile.getLoaders() — compiled against standalone
        # neoforgespi 8.0.4, absent from the loader 3.0.45 NeoForge 20.6 runs on — and threw
        # NoSuchMethodError. No 1.20.6 test mod had a mixin then, so nothing here ran that path.
        if: matrix.cell.name == 'neoforge-1.20.6'
        shell: bash
        run: |
          set -euo pipefail
          LOG=smoke-${{ matrix.cell.name }}-${{ runner.os }}.log
          grep -q '\[mcdp-smoke\] mixin=BlocksClinitMixin mod=neoforge_example_1206 ok' "$LOG" || {
            echo "ERROR: NeoForge 1.20.6 mixin marker missing — the bridge did not resolve"
            grep '\[mcdp-smoke\]' "$LOG" || true
            exit 1
          }

      - name: Assert Forge lifecycle + mixin-bridge markers (forge-1.20 only)
        # forge-example-1.20 is the only Forge cell carrying a mixin, and it is the only
        # end-to-end proof of three things that are otherwise verified by javap alone:
        # the lazy bridge populator, the CONSTRUCT staging in McdpModContainer.activityMap,
        # and acceptEvent actually forwarding mod-bus events.
        if: matrix.cell.name == 'forge-1.20'
        shell: bash
        run: |
          set -euo pipefail
          LOG=smoke-${{ matrix.cell.name }}-${{ runner.os }}.log
          echo "=== [mcdp-smoke] lines ==="
          grep '\[mcdp-smoke\]' "$LOG" | sort -u

          MISSING=0
          # The mixin runs inside Blocks.<clinit> (Bootstrap.bootStrap), long before FML's
          # loadMod sweep — so its marker is also the proof the bridge registry is populated
          # on demand rather than eagerly at container construction.
          grep -q 'mixin=BlocksClinitMixin ok' "$LOG" || {
            echo "ERROR: mixin marker missing — lazy bridge populator did not fire"; MISSING=1; }
          # dist=DEDICATED_SERVER (not 'null') proves forgespi's Environment.get() resolved.
          grep -qE 'stage=CONSTRUCT mod=forge_example_120 dist=[A-Z_]+' "$LOG" || {
            echo "ERROR: CONSTRUCT marker missing or dist was null"; MISSING=1; }
          grep -q 'stage=FMLCommonSetupEvent mod=forge_example_120' "$LOG" || {
            echo "ERROR: FMLCommonSetupEvent never arrived — acceptEvent is not forwarding"; MISSING=1; }
          [ "$MISSING" = 0 ] || exit 1

          # Ordering: Blocks.<clinit> must precede the entry constructor. If CONSTRUCT came
          # first the mixin would be resolving against an already-populated registry and would
          # no longer be evidence for the lazy path.
          MIXIN_LINE=$(grep -n 'mixin=BlocksClinitMixin ok' "$LOG" | head -1 | cut -d: -f1)
          CTOR_LINE=$(grep -n 'stage=CONSTRUCT mod=forge_example_120' "$LOG" | head -1 | cut -d: -f1)
          echo "mixin@$MIXIN_LINE construct@$CTOR_LINE"
          [ "$MIXIN_LINE" -lt "$CTOR_LINE" ] || {
            echo "ERROR: mixin fired after CONSTRUCT — not exercising the lazy populator"; exit 1; }

      - name: Assert bridge codegen actually emitted (forge-1.20 only)
        # Guards the way this cell is most likely to pass for the wrong reason: codegen
        # silently emitting nothing, leaving the mixin calling its handler directly.
        # Reads the processResources output rather than the jar — `:runServer` never builds one,
        # and the exploded resources dir is what the dev run actually loads the manifest from.
        if: matrix.cell.name == 'forge-1.20'
        working-directory: ${{ matrix.cell.dir }}
        shell: bash
        run: |
          set -euo pipefail
          TOML=build/resources/main/META-INF/mcdp-bridges.toml
          test -f "$TOML" || {
            echo "ERROR: $TOML missing — no bridge was generated"; exit 1; }
          COUNT=$(grep -c '^\[\[bridge\]\]' "$TOML")
          echo "toml-bridges=$COUNT"
          [ "$COUNT" -ge 1 ] || { echo "ERROR: no [[bridge]] entries"; exit 1; }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-bands-${{ matrix.cell.name }}-${{ runner.os }}
          path: |
            smoke-${{ matrix.cell.name }}-${{ runner.os }}.log
            ${{ matrix.cell.dir }}/run/logs/**
            ${{ matrix.cell.dir }}/run/crash-reports/**
            ${{ matrix.cell.dir }}/build/reports/**
          if-no-files-found: ignore

  # Version-isolation smoke (task #22 / ADR-0001).
  #
  # Two fabric mods pin different cats-core SHAs (fabric-example → 2.13.0,
  # fabric-example-v2 → 2.10.0). Both mods boot together; each prints a
  # [mcdp-smoke] line containing System.identityHashCode(cats.Functor.class)
  # and its defining classloader. Distinct classloader ids prove per-mod
  # URLClassLoader isolation: SHA-keyed loader coalescing (ADR-0006) routes
  # each mod to its own cats-core loader.
  #
  # Runs only on Linux — adds no coverage a second OS would provide, since
  # the isolation boundary is classloader identity (pure JVM), and Tier-2
  # runserver-smoke above already exercises the Windows path separately.
  version-isolation-fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts', 'settings.gradle.kts', '*/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Minecraft assets (fabric)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
          key: mc-assets-${{ runner.os }}-fabric-1.21.1
          restore-keys: |
            mc-assets-${{ runner.os }}-fabric-

      - name: Build mcdepprovider (publishes to composite build)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Build both test-mod jars
        shell: bash
        run: |
          set -euo pipefail
          (cd test-mods/fabric-example    && ../../gradlew build --no-daemon --stacktrace)
          (cd test-mods/fabric-example-v2 && ../../gradlew build --no-daemon --stacktrace)

      - name: Assert manifests pin different cats-core SHAs
        shell: bash
        run: |
          set -euo pipefail
          M1=test-mods/fabric-example/build/mcdepprovider/META-INF/mcdepprovider.toml
          M2=test-mods/fabric-example-v2/build/mcdepprovider/META-INF/mcdepprovider.toml
          test -f "$M1" && test -f "$M2" || { echo "manifest(s) missing"; exit 1; }
          SHA1=$(grep -A2 'cats-core_3' "$M1" | grep -oE 'sha256 = "[0-9a-f]{64}"' | head -1)
          SHA2=$(grep -A2 'cats-core_3' "$M2" | grep -oE 'sha256 = "[0-9a-f]{64}"' | head -1)
          echo "v1 cats sha: $SHA1"
          echo "v2 cats sha: $SHA2"
          [ -n "$SHA1" ] && [ -n "$SHA2" ] || { echo "cats-core sha missing"; exit 1; }
          [ "$SHA1" != "$SHA2" ] || { echo "expected distinct SHAs — version isolation cannot be proven"; exit 1; }

      - name: Stage both remapped jars into fabric-example run/mods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-mods/fabric-example/run/mods
          cp test-mods/fabric-example-v2/build/libs/*.jar test-mods/fabric-example/run/mods/
          ls -la test-mods/fabric-example/run/mods/

      - name: Boot fabric server with both mods
        working-directory: test-mods/fabric-example
        shell: bash
        run: |
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 900 \
            --log-file ../../version-iso-fabric.log

      - name: Assert two distinct [mcdp-smoke] classloader ids
        shell: bash
        run: |
          set -euo pipefail
          LOG=version-iso-fabric.log
          test -f "$LOG" || { echo "log missing"; exit 1; }
          LINES=$(grep -c '\[mcdp-smoke\]' "$LOG" || true)
          echo "[mcdp-smoke] line count: $LINES"
          [ "$LINES" -ge 2 ] || { echo "expected ≥2 [mcdp-smoke] lines"; grep '\[mcdp-smoke\]' "$LOG" || true; exit 1; }
          LOADER_IDS=$(grep -oE 'cats\.loader\.id=[0-9]+' "$LOG" | sort -u | wc -l)
          echo "distinct cats.loader.id values: $LOADER_IDS"
          [ "$LOADER_IDS" -ge 2 ] || {
            echo "ERROR: expected ≥2 distinct cats classloader ids — mods are sharing a loader"
            grep '\[mcdp-smoke\]' "$LOG"
            exit 1
          }
          CLASS_IDS=$(grep -oE 'cats\.Functor\.class\.id=[0-9]+' "$LOG" | sort -u | wc -l)
          [ "$CLASS_IDS" -ge 2 ] || {
            echo "ERROR: expected ≥2 distinct cats.Functor.class ids"
            grep '\[mcdp-smoke\]' "$LOG"
            exit 1
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: version-iso-fabric
          path: |
            version-iso-fabric.log
            test-mods/fabric-example/run/logs/**
            test-mods/fabric-example/run/crash-reports/**
            test-mods/*/build/mcdepprovider/META-INF/*.toml
          if-no-files-found: ignore

  # ModContainer-in-ctor smoke (ADR-0017).
  #
  # kotlin-example's @Mod entry is `class ExampleMod(IEventBus, ModContainer, Dist)`. The
  # constructor's init block prints `[mcdp-smoke] mod=kotlin_example ... container.modId=...
  # dist=...`. After runServer reaches first tick, we grep the log to confirm the
  # modContainer arg threaded through to the entry constructor with the expected modId, and
  # that FMLEnvironment.dist plumbed through too. This proves McdpModContainer.constructMod
  # built the bag correctly under live FML — vanilla-parity lifecycle.
  modcontainer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts', 'settings.gradle.kts', '*/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Minecraft assets (neoforge)
        uses: actions/cache@v4
        with:
          path: |
            ~/.neoforge
          key: mc-assets-${{ runner.os }}-neoforge-1.21.1
          restore-keys: |
            mc-assets-${{ runner.os }}-neoforge-

      - name: Build mcdepprovider (publishes to composite build)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Boot kotlin-example NeoForge server
        working-directory: test-mods/kotlin-example
        shell: bash
        run: |
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 900 \
            --log-file ../../modcontainer-kotlin.log

      - name: Assert ModContainer + Dist plumbed through to mod ctor
        shell: bash
        run: |
          set -euo pipefail
          LOG=modcontainer-kotlin.log
          test -f "$LOG" || { echo "log missing"; exit 1; }
          grep '\[mcdp-smoke\]' "$LOG" | head -5
          grep -q 'container\.modId=kotlin_example' "$LOG" || {
            echo "ERROR: ModContainer not threaded through to ctor (expected container.modId=kotlin_example)"
            grep '\[mcdp-smoke\]' "$LOG" || true
            exit 1
          }
          grep -qE 'dist=(CLIENT|DEDICATED_SERVER)' "$LOG" || {
            echo "ERROR: Dist not threaded through (expected dist=CLIENT or dist=DEDICATED_SERVER)"
            grep '\[mcdp-smoke\]' "$LOG" || true
            exit 1
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: modcontainer-kotlin
          path: |
            modcontainer-kotlin.log
            test-mods/kotlin-example/run/logs/**
            test-mods/kotlin-example/run/crash-reports/**
          if-no-files-found: ignore

  # Mixin codegen smoke (ADR-0018).
  #
  # mixin-example is a Fabric mod whose 6 server-side mixins call into mod-private Java
  # helpers. The Gradle plugin's auto-codegen rewrites each @Inject body to dispatch through
  # a generated bridge interface (loaded parent-first via the auto-added bridge package) and
  # a per-mod forwarding impl (loaded by the mod's ModClassLoader). This job boots the
  # server and asserts every mixin handler fired — proving the codegen output verifies under
  # Sponge Mixin's transformer + the per-mod loader contract end-to-end.
  #
  # Linux-only — the codegen is pure JVM bytecode, mirrors of the Tier-2 runserver-smoke
  # already cover the Windows path classloading shape.
  mixin-codegen-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts', 'settings.gradle.kts', '*/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Minecraft assets (fabric)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
          key: mc-assets-${{ runner.os }}-fabric-1.21.1
          restore-keys: |
            mc-assets-${{ runner.os }}-fabric-

      - name: Build mcdepprovider (publishes to composite build)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Build mixin-example and assert codegen artifacts present
        working-directory: test-mods/mixin-example
        shell: bash
        run: |
          set -euo pipefail
          ../../gradlew build --no-daemon --stacktrace

          # The codegen task must have run and produced a report listing rewrites.
          REPORT=build/mcdp-bridges/report.txt
          test -f "$REPORT" || { echo "codegen report missing at $REPORT"; exit 1; }
          cat "$REPORT"
          grep -q 'rewritten mixins (8)' "$REPORT" || {
            echo "ERROR: expected report to list 8 rewritten mixins"; exit 1; }

          # The remapped mod jar must contain bridge classes + the unified TOML manifest.
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          test -f "$JAR" || { echo "no jar built"; exit 1; }
          # Bridge interfaces live in <bridgePackage>/, impls in the sibling
          # <bridgePackage>_impl/ (ADR-0018 errata, ADR-0021).
          BRIDGE_ENTRIES=$(unzip -l "$JAR" | grep -E 'mcdp_bridges/.*Bridge\.class$' | wc -l)
          IMPL_ENTRIES=$(unzip -l "$JAR" | grep -E 'mcdp_bridges_impl/.*BridgeImpl\.class$' | wc -l)
          # Single-file TOML manifest (ADR-0019); content scanned for [[bridge]] count.
          unzip -l "$JAR" | grep -q 'META-INF/mcdp-bridges\.toml' || {
            echo "ERROR: META-INF/mcdp-bridges.toml missing from jar"; exit 1; }
          BRIDGE_TOML_COUNT=$(unzip -p "$JAR" META-INF/mcdp-bridges.toml | grep -c '^\[\[bridge\]\]')
          echo "bridge interfaces=$BRIDGE_ENTRIES impls=$IMPL_ENTRIES toml-bridges=$BRIDGE_TOML_COUNT"
          [ "$BRIDGE_ENTRIES" -ge 2 ] || { echo "expected ≥2 bridge interfaces"; exit 1; }
          [ "$IMPL_ENTRIES" -ge 2 ] || { echo "expected ≥2 bridge impls"; exit 1; }
          # 8 rewritten mixins; MultiTargetMixin contributes 2 entries → 9 total.
          [ "$BRIDGE_TOML_COUNT" -ge 9 ] || { echo "expected ≥9 [[bridge]] entries (8 mixins + MultiTargetMixin's second target)"; exit 1; }

      - name: Boot mixin-example fabric server
        working-directory: test-mods/mixin-example
        shell: bash
        run: |
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 900 \
            --log-file ../../mixin-codegen.log

      - name: Assert all 9 mixin markers + boot line fired
        shell: bash
        run: |
          set -euo pipefail
          LOG=mixin-codegen.log
          test -f "$LOG" || { echo "log missing"; exit 1; }
          echo "=== [mcdp-smoke] lines ==="
          grep '\[mcdp-smoke\]' "$LOG" | sort -u

          grep -q 'mod=mixin_example boot ok' "$LOG" || {
            echo "ERROR: entrypoint did not boot (no boot ok line)"; exit 1; }

          # BlocksClinitMixin fires during server init (before tick) — catches the empty-registry
          # bug from the mc-fluid-physics report. MultiTargetMixinA/B are emitted from a single
          # mixin body that calls into two mod-private types — catches the multi-[[bridge]] case.
          MISSING=0
          for n in MinecraftServerOneMixin MinecraftServerTwoMixin MinecraftServerThreeMixin \
                   MinecraftServerFourMixin MinecraftServerFiveMixin MinecraftServerSixMixin \
                   BlocksClinitMixin MultiTargetMixinA MultiTargetMixinB; do
            if ! grep -q "mixin=$n ok" "$LOG"; then
              echo "ERROR: mixin marker missing for $n"
              MISSING=1
            fi
          done
          [ "$MISSING" = 0 ] || exit 1

          # Defensive: any of these in the log indicates the codegen produced bytecode
          # the runtime rejected, or the bridge wiring failed.
          for pat in 'NoClassDefFoundError' 'IllegalAccessError' 'VerifyError' \
                     'mcdepprovider:.*not found'; do
            if grep -E "$pat" "$LOG"; then
              echo "ERROR: forbidden pattern '$pat' in log"; exit 1
            fi
          done

      - name: Build shared-mixin-example — the consumer shape validator A never saw
        # This mod shares the package its mixins live in, which is what mc-fluid-physics does
        # and what no other in-tree mod does: every other one shares a dedicated
        # `com.example.api`, and mixin-example deliberately shares nothing. Validator A had
        # therefore never produced a non-trivial result in CI, and a false positive that failed
        # a working consumer went unnoticed until someone pointed mcdp at a real mod.
        #
        # `build`, not just `runServer`: validateSharedPackages is wired to `check`, so a boot
        # alone would not run it.
        working-directory: test-mods/shared-mixin-example
        shell: bash
        run: ../../gradlew build --no-daemon --stacktrace

      - name: Boot shared-mixin-example and assert every bridged shape applied
        # The constructor shape fails at mixin-apply with a VerifyError, not at compile, so the
        # boot is the only thing that can catch it. Each shape is its own mixin class because a
        # mixin apply failure is per-class -- co-located, one broken shape would mask the others.
        working-directory: test-mods/shared-mixin-example
        shell: bash
        run: |
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 900 \
            --log-file ../../shared-mixin.log

      - name: Assert the shared-mixin markers fired
        shell: bash
        run: |
          set -euo pipefail
          LOG=shared-mixin.log
          echo "=== [mcdp-smoke] lines ==="
          grep '\[mcdp-smoke\]' "$LOG" | sort -u
          MISSING=0
          for shape in bridged-call-to-local bridged-call-on-stack ctor-to-local; do
            grep -q "shared-mixin shape=$shape ok" "$LOG" || {
              echo "ERROR: shape '$shape' did not apply"; MISSING=1; }
          done
          grep -q 'mod=shared_mixin_example boot ok' "$LOG" || {
            echo "ERROR: the mod never initialised"; MISSING=1; }
          [ "$MISSING" = 0 ] || exit 1

      - name: Upload logs + codegen report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mixin-codegen
          path: |
            mixin-codegen.log
            shared-mixin.log
            test-mods/shared-mixin-example/run/logs/**
            test-mods/shared-mixin-example/run/crash-reports/**
            test-mods/mixin-example/run/logs/**
            test-mods/mixin-example/run/crash-reports/**
            test-mods/mixin-example/build/mcdp-bridges/**
          if-no-files-found: ignore
