# MIRROR — do not edit here. Canonical source: .github/workflows/mc-smoke.yml
# Edit the .github copy, then copy it verbatim to this path (only this header differs).
name: CI — Tier 2 (MC runServer smoke)

# Why this workflow is separate from Tier-1 (ci.yml):
#   Minecraft dev servers pull the MC toolchain (~200 MB), assets, and mappings.
#   Full boot-to-first-tick is 3–10 min wall time. We run it on push-to-main and
#   nightly, not on every PR, so unit-level signal stays fast.
#
# Coverage goals:
#   1. NeoForge adapter boots MC 1.21.1 to first tick through mcdepprovider.
#   2. Fabric adapter boots MC 1.21.1 to first tick through mcdepprovider.
#   3. Dev-mode parity (ADR-0007): no manifest-listed jar ends up on MC classpath.
#   4. Second-boot offline: cache populated on first boot serves the second boot
#      without any network access.
#
# Cache policy:
#   - Gradle home YES (per-OS, keyed on libs.versions.toml + *.gradle.kts).
#   - MC assets cache YES (per-OS, per-MC-version key).
#   - ~/.cache/mcdepprovider NO — the offline-boot step needs to populate it
#     from the real download path within the same job. Caching across jobs
#     would hide download regressions.

on:
  push:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC — after most PRs merge, before the workday starts.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: mc-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runserver-smoke:
    strategy:
      fail-fast: false
      matrix:
        # Linux catches most. Windows catches path + hard-link issues specific to
        # the LibraryCache (ADR-0006). macOS is out — no additional coverage for
        # a pure-JVM project whose platform surface is the cache dir.
        os: [ubuntu-latest, windows-latest]
        platform:
          - { name: neoforge, dir: test-mods/neoforge-example }
          - { name: fabric,   dir: test-mods/fabric-example   }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts', 'settings.gradle.kts', '*/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Minecraft assets (${{ matrix.platform.name }})
        uses: actions/cache@v4
        with:
          # ModDevGradle stashes MC assets under ~/.neoforge; Loom under ~/.gradle/caches/fabric-loom.
          # Both benefit from per-OS caching — MC's asset manifest is ~200 MB and stable per MC version.
          path: |
            ~/.neoforge
            ~/.gradle/caches/fabric-loom
          key: mc-assets-${{ runner.os }}-${{ matrix.platform.name }}-1.21.1
          restore-keys: |
            mc-assets-${{ runner.os }}-${{ matrix.platform.name }}-

      - name: Build mcdepprovider (publishes to composite build for test-mods)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Generate manifest (${{ matrix.platform.name }})
        working-directory: ${{ matrix.platform.dir }}
        run: ../../gradlew generateMcdpManifest --no-daemon --stacktrace

      - name: Assert manifest has Scala + cats + circe with valid SHAs
        shell: bash
        run: |
          set -euo pipefail
          M="${{ matrix.platform.dir }}/build/mcdepprovider/META-INF/mcdepprovider.toml"
          test -f "$M" || { echo "manifest not at $M"; exit 1; }
          grep -q 'cats-kernel_3' "$M" || { echo "cats-kernel_3 missing"; cat "$M"; exit 1; }
          grep -q 'scala3-library_3' "$M" || { echo "scala3-library_3 missing"; cat "$M"; exit 1; }
          grep -q 'circe-core_3' "$M" || { echo "circe-core_3 missing"; cat "$M"; exit 1; }
          grep -qE 'sha256 = "[0-9a-f]{64}"' "$M" || { echo "no valid sha256 lines"; cat "$M"; exit 1; }

      - name: First boot — online, populates mcdepprovider cache
        working-directory: ${{ matrix.platform.dir }}
        run: |
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 900 \
            --log-file ../../smoke-${{ matrix.platform.name }}-${{ runner.os }}-boot1.log
        shell: bash

      - name: Classpath parity check (ADR-0007)
        # Dumps the runServer classpath at configuration-time (no MC boot) and asserts
        # that no manifest-listed jar appears on it. If any does, RunTaskClasspathPatch
        # didn't strip them — dev-mode parity is broken.
        working-directory: ${{ matrix.platform.dir }}
        shell: bash
        run: |
          set -euo pipefail
          M="build/mcdepprovider/META-INF/mcdepprovider.toml"
          COORDS=$(grep -oE 'coords = "[^"]+"' "$M" | sed -E 's/.*"([^"]+)".*/\1/')
          # Ask Gradle to dump the runServer classpath to a file for inspection.
          ../../gradlew :runServerClasspath --no-daemon --stacktrace 2>/dev/null \
            || echo "note: :runServerClasspath task not present — skipping parity check"
          CP_FILE="build/runServer-classpath.txt"
          if [ -f "$CP_FILE" ]; then
            FAIL=0
            for coord in $COORDS; do
              artifact=$(echo "$coord" | awk -F: '{print $2"-"$3".jar"}')
              if grep -q "/$artifact" "$CP_FILE"; then
                echo "ERROR: manifest-listed jar '$artifact' is still on MC classpath"
                FAIL=1
              fi
            done
            [ "$FAIL" = 0 ] || exit 1
          fi

      - name: Second boot — offline, cache-hit only
        working-directory: ${{ matrix.platform.dir }}
        shell: bash
        # NOTE: this step used to set MCDP_HTTP_TIMEOUT_MS as a "defensive" offline
        # guard, but no such env var is read anywhere in the runtime -- it was a no-op.
        # The real assertion is below: if the first boot's cache is complete, the second
        # boot makes no HTTP call at all, which mc_smoke.py checks from the log.
        run: |
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 600 \
            --log-file ../../smoke-${{ matrix.platform.name }}-${{ runner.os }}-boot2.log

      - name: Upload MC logs + crash reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mc-smoke-${{ matrix.platform.name }}-${{ runner.os }}
          path: |
            smoke-*.log
            ${{ matrix.platform.dir }}/run/logs/**
            ${{ matrix.platform.dir }}/run/crash-reports/**
            ${{ matrix.platform.dir }}/build/reports/**
            ${{ matrix.platform.dir }}/build/mcdepprovider/META-INF/*.toml
          if-no-files-found: ignore

      - name: Upload boot logs on success (for trend analysis)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mc-smoke-success-${{ matrix.platform.name }}-${{ runner.os }}
          path: |
            smoke-*.log
          if-no-files-found: ignore
          retention-days: 14

  # Per-band runServer smoke (ADR-0023).
  #
  # The multi-MC-band restructure ships six bands of Fabric/NeoForge/Forge adapters.
  # `runserver-smoke` above only covers MC 1.21.1; a regression in any per-band SPI
  # port (Forge 4.0 vs 7.x, NeoForge 8.0.x vs 9.0.x, fabric-loader 0.14 vs 0.15) would
  # not surface until release. This job boots one test mod per (loader × band) cell.
  #
  # Excluded from coverage (also documented per-mod in test-mods/README.md):
  #   - 26.1 (fabric + neoforge): MC 26.1.x is scaffold-only — Mojang has not shipped
  #     real artifacts; Loom errors "26.1.2 requires Java 25 but Gradle is using 21".
  #   - Forge 1.17: the adapter is still a stub — forge-1.17's McdpLanguageProvider
  #     throws UnsupportedOperationException (forgespi 3.2.x's loadMod predates
  #     ModuleLayer; IModFileInfo.getFile() is missing). A cell here could only ever
  #     assert "boot fails", which is not worth a nightly runner. Add it when the real
  #     port lands — the scaffold (own Gradle 7.6 wrapper, mavenLocal consumption) is
  #     already in place, so it is a one-row change at that point. Its extra wrinkle:
  #     test-mods/forge-example-1.17 pins `toolchain { languageVersion = 16 }`, and
  #     GitHub runners ship no JDK 16, so that row will also need a 16 in the
  #     setup-java list below.
  #
  # Forge 1.18 used to be excluded here for a second, *wrong* reason: "mcdp's
  # gradle-plugin is built against Gradle 8 APIs". It is not. Every org.gradle.* type
  # and method it uses exists in Gradle 7.6; the only real blocker was that the plugin
  # compiled to Java 21 bytecode, so a Gradle 7.6 daemon on JDK 17 rejected its
  # published variant (org.gradle.jvm.version=21). :gradle-plugin now targets Java 17
  # (root build.gradle.kts) and loads on ForgeGradle 5.1 / Gradle 7.6. ADR-0023's
  # "Consequences — negative" bullet is superseded; see its errata section.
  #
  # Why these cells were red and nobody noticed (run 35485761394, the only nightly this
  # job has ever had): forge-1.20 and neoforge-1.20.6 were cancelled at exactly 30:00 on
  # both OSes. The logs show they had already SUCCEEDED — `[mcdp-smoke] ... boot ok` and
  # MC's `Done (28.875s)!` both appear ~3 min in — and then sat idle for ~26 min until
  # `timeout-minutes` killed them. The step ran plain `gradlew runServer | tee`, which has
  # no way to stop a server that booted fine. The Fabric cells "passed" only by accident:
  # they set needs_eula=false, so MC halts itself at the EULA gate seconds after the mod
  # initializer prints the marker — they never reached first tick at all. Both problems
  # are fixed the same way: run every cell through scripts/mc_smoke.py, exactly like the
  # 1.21 cells above, which waits for the first-tick marker and then kills the process
  # tree. (The old comment claiming mc_smoke.py "asserts manifest-driven cats/circe
  # contents" was wrong — that assertion is a separate workflow step, not part of the
  # script.) Side effect worth knowing: a cancelled job never runs actions/cache's
  # post-save step, which is why `mc-assets-*-forge-*` / `-neoforge-1.20.6` have never
  # been populated and every nightly started cold. One green run fixes that for good.
  #
  # Triggers: nightly only (no push). 7 cells × 2 OSes = 14 jobs. Measured real work per
  # cell is ~1 min publish + ~2–4 min boot-to-first-tick, so steady state is ≈ 60–90
  # runner-minutes per nightly (the cells run in parallel, so wall time is one cell).
  # timeout-minutes is a backstop, not a budget — see the note on it below.
  # The base 1.21 smoke above stays on push so PRs still get end-to-end signal.
  runserver-smoke-bands:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        cell:
          # Each cell: dir = test mod root; modid = expected [mcdp-smoke] mod ID;
          # cache_key = MC version key; loader = fabric|neoforge|forge (which cache
          # paths to populate); daemon_jdk = JDK the *test mod's* Gradle build must run
          # on, empty = use the job default (21). Only the ForgeGradle 5.1 bands need an
          # override: FG 5.1 rejects Gradle 8, so those mods carry their own Gradle 7.6
          # wrapper, and Gradle 7.6 cannot run on JDK 21.
          #
          # There is no needs_eula field any more: mc_smoke.py writes run/eula.txt=true
          # itself for every cell, unconditionally. The old flag was also the reason the
          # Fabric cells looked green without reaching first tick (see the note above).
          - { name: fabric-1.17,    dir: test-mods/fabric-example-1.17,    modid: fabric_example_117,    cache_key: 1.17.1, loader: fabric,   daemon_jdk: "" }
          - { name: fabric-1.18,    dir: test-mods/fabric-example-1.18,    modid: fabric_example_118,    cache_key: 1.18.2, loader: fabric,   daemon_jdk: "" }
          - { name: fabric-1.20,    dir: test-mods/fabric-example-1.20,    modid: fabric_example_120,    cache_key: 1.20.1, loader: fabric,   daemon_jdk: "" }
          - { name: fabric-1.20.6,  dir: test-mods/fabric-example-1.20.6,  modid: fabric_example_1206,   cache_key: 1.20.6, loader: fabric,   daemon_jdk: "" }
          - { name: neoforge-1.20.6,dir: test-mods/neoforge-example-1.20.6,modid: neoforge_example_1206, cache_key: 1.20.6, loader: neoforge, daemon_jdk: "" }
          - { name: forge-1.20,     dir: test-mods/forge-example-1.20,     modid: forge_example_120,     cache_key: 1.20.1, loader: forge,    daemon_jdk: "" }
          # ForgeGradle 5.1 band. Own Gradle 7.6 wrapper, no includeBuild("../.."),
          # consumes mcdp + the mcdp gradle-plugin from mavenLocal (populated by the
          # preflight step below). Needs the JDK 17 daemon.
          - { name: forge-1.18,     dir: test-mods/forge-example-1.18,     modid: forge_example_118,     cache_key: 1.18.2, loader: forge,    daemon_jdk: "17" }
    runs-on: ${{ matrix.os }}
    # Backstop, not a budget. Measured real work is 3–5 min/cell; the sibling
    # `runserver-smoke` job (which does strictly more per job — full ./gradlew build plus
    # two boots) uses 45 and its slowest fully-cold cell ever measured was 11:46
    # (windows/neoforge, run 35465565854). 45 matches that job and leaves headroom for the
    # one genuinely unmeasured cost here: a cold ForgeGradle userdev/decompile setup, which
    # no run has ever completed because these cells were always cancelled first.
    # Note the script timeout below is deliberately lower (30 min) so a hang is reported as
    # a *failure* — cancelled jobs skip both the log upload and the actions/cache post-save.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDKs (21 default, 17 for the ForgeGradle 5.1 bands)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Multiple versions: setup-java installs each and exports JAVA_HOME_<major>_X64
          # for it. The LAST entry wins JAVA_HOME/PATH, so the repo build and every
          # Gradle-8 cell keep JDK 21 with no per-cell handling; the forge-1.18 cell picks
          # JAVA_HOME_17_X64 back up explicitly in the runServer step.
          java-version: |
            17
            21

      - name: Set up Python 3.12
        # scripts/mc_smoke.py runs the server and shuts it down on the first-tick marker.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts', 'settings.gradle.kts', '*/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Minecraft assets (${{ matrix.cell.loader }} ${{ matrix.cell.cache_key }})
        uses: actions/cache@v4
        with:
          # Loom (fabric) → ~/.gradle/caches/fabric-loom
          # ModDevGradle (neoforge) → ~/.neoforge
          # ForgeGradle (forge) → ~/.gradle/caches/forge_gradle
          #
          # Both Loom's and ForgeGradle's trees already sit under ~/.gradle/caches, which
          # the Gradle-home cache above restores wholesale; only ~/.neoforge is strictly
          # additive. They are still listed because this entry is keyed per loader+MC
          # version, so a band gets its MC artifacts back from a restore-key even when the
          # gradle-home key rotates on a build-file edit. Nothing here was ever actually
          # saved for the forge/neoforge cells: actions/cache's post-save step does not run
          # on a cancelled job, and those cells were cancelled every time. The mc_smoke.py
          # change below is what makes these caches start working.
          path: |
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/forge_gradle
            ~/.neoforge
          key: mc-assets-${{ runner.os }}-${{ matrix.cell.loader }}-${{ matrix.cell.cache_key }}
          restore-keys: |
            mc-assets-${{ runner.os }}-${{ matrix.cell.loader }}-

      - name: Publish mcdp aggregator + plugin to mavenLocal
        # The non-1.21 test mods consume mcdp-X via either composite-include
        # (fabric, neoforge bands) or mavenLocal (forge bands — see ADR-0023 for why).
        # Either way, publishing all aggregators + the gradle-plugin to mavenLocal first
        # is the simplest universal preflight.
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace
        shell: bash

      - name: runServer (${{ matrix.cell.name }})
        working-directory: ${{ matrix.cell.dir }}
        shell: bash
        # Same runner as the 1.21 cells above. mc_smoke.py spawns `gradlew :runServer`,
        # tails it, and terminates the whole process tree once MC prints its first-tick
        # marker — runServer itself has no self-exit flag, which is exactly why the plain
        # `gradlew runServer | tee` this replaced hung until timeout-minutes killed the job.
        # It also handles the three things the old inline version got wrong or not at all:
        #   * writes run/eula.txt=true for every cell, so Fabric cells reach first tick
        #     instead of halting at the EULA gate seconds after the mod initializer ran;
        #   * kills the forked MC JVM via process group / taskkill /T, so no orphan java
        #     process survives to hold run/world/session.lock (the cancelled jobs logged
        #     "Terminate orphan process: pid (java)" every time);
        #   * fails fast on NoClassDefFoundError / ResolutionException / "Invalid package
        #     name" rather than waiting out the timeout.
        # Wrapper selection is the script's own walk-up from --cwd: it uses the nearest
        # gradlew at or above the mod dir, so forge-example-1.18 gets its committed Gradle
        # 7.6 wrapper and every other cell falls through to the repo-root 8.11.1 one.
        # --timeout 1800 covers a cold ForgeGradle userdev/decompile setup, which happens
        # inside this single Gradle invocation, and stays under timeout-minutes: 45.
        run: |
          set -euo pipefail
          # ForgeGradle 5.1 bands: Gradle 7.6 cannot run on JDK 21. Swap JAVA_HOME to the
          # JDK this cell asked for; mc_smoke.py inherits it through to the wrapper.
          JDK='${{ matrix.cell.daemon_jdk }}'
          if [ -n "$JDK" ]; then
            VAR="JAVA_HOME_${JDK}_X64"
            JH="${!VAR:-}"
            [ -n "$JH" ] || { echo "ERROR: $VAR not set by setup-java"; env | grep '^JAVA_HOME' || true; exit 1; }
            export JAVA_HOME="$JH"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 1800 \
            --log-file ../../smoke-${{ matrix.cell.name }}-${{ runner.os }}.log

      - name: Assert smoke marker fired
        shell: bash
        run: |
          set -euo pipefail
          LOG=smoke-${{ matrix.cell.name }}-${{ runner.os }}.log
          test -f "$LOG" || { echo "log missing"; exit 1; }
          grep -q "\[mcdp-smoke\] mod=${{ matrix.cell.modid }} boot ok" "$LOG" || {
            echo "ERROR: smoke marker for ${{ matrix.cell.modid }} not in log"
            grep '\[mcdp-smoke\]' "$LOG" || true
            exit 1
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-bands-${{ matrix.cell.name }}-${{ runner.os }}
          path: |
            smoke-${{ matrix.cell.name }}-${{ runner.os }}.log
            ${{ matrix.cell.dir }}/run/logs/**
            ${{ matrix.cell.dir }}/run/crash-reports/**
            ${{ matrix.cell.dir }}/build/reports/**
          if-no-files-found: ignore

  # Version-isolation smoke (task #22 / ADR-0001).
  #
  # Two fabric mods pin different cats-core SHAs (fabric-example → 2.13.0,
  # fabric-example-v2 → 2.10.0). Both mods boot together; each prints a
  # [mcdp-smoke] line containing System.identityHashCode(cats.Functor.class)
  # and its defining classloader. Distinct classloader ids prove per-mod
  # URLClassLoader isolation: SHA-keyed loader coalescing (ADR-0006) routes
  # each mod to its own cats-core loader.
  #
  # Runs only on Linux — adds no coverage a second OS would provide, since
  # the isolation boundary is classloader identity (pure JVM), and Tier-2
  # runserver-smoke above already exercises the Windows path separately.
  version-isolation-fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts', 'settings.gradle.kts', '*/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Minecraft assets (fabric)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
          key: mc-assets-${{ runner.os }}-fabric-1.21.1
          restore-keys: |
            mc-assets-${{ runner.os }}-fabric-

      - name: Build mcdepprovider (publishes to composite build)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Build both test-mod jars
        shell: bash
        run: |
          set -euo pipefail
          (cd test-mods/fabric-example    && ../../gradlew build --no-daemon --stacktrace)
          (cd test-mods/fabric-example-v2 && ../../gradlew build --no-daemon --stacktrace)

      - name: Assert manifests pin different cats-core SHAs
        shell: bash
        run: |
          set -euo pipefail
          M1=test-mods/fabric-example/build/mcdepprovider/META-INF/mcdepprovider.toml
          M2=test-mods/fabric-example-v2/build/mcdepprovider/META-INF/mcdepprovider.toml
          test -f "$M1" && test -f "$M2" || { echo "manifest(s) missing"; exit 1; }
          SHA1=$(grep -A2 'cats-core_3' "$M1" | grep -oE 'sha256 = "[0-9a-f]{64}"' | head -1)
          SHA2=$(grep -A2 'cats-core_3' "$M2" | grep -oE 'sha256 = "[0-9a-f]{64}"' | head -1)
          echo "v1 cats sha: $SHA1"
          echo "v2 cats sha: $SHA2"
          [ -n "$SHA1" ] && [ -n "$SHA2" ] || { echo "cats-core sha missing"; exit 1; }
          [ "$SHA1" != "$SHA2" ] || { echo "expected distinct SHAs — version isolation cannot be proven"; exit 1; }

      - name: Stage both remapped jars into fabric-example run/mods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-mods/fabric-example/run/mods
          cp test-mods/fabric-example-v2/build/libs/*.jar test-mods/fabric-example/run/mods/
          ls -la test-mods/fabric-example/run/mods/

      - name: Boot fabric server with both mods
        working-directory: test-mods/fabric-example
        shell: bash
        run: |
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 900 \
            --log-file ../../version-iso-fabric.log

      - name: Assert two distinct [mcdp-smoke] classloader ids
        shell: bash
        run: |
          set -euo pipefail
          LOG=version-iso-fabric.log
          test -f "$LOG" || { echo "log missing"; exit 1; }
          LINES=$(grep -c '\[mcdp-smoke\]' "$LOG" || true)
          echo "[mcdp-smoke] line count: $LINES"
          [ "$LINES" -ge 2 ] || { echo "expected ≥2 [mcdp-smoke] lines"; grep '\[mcdp-smoke\]' "$LOG" || true; exit 1; }
          LOADER_IDS=$(grep -oE 'cats\.loader\.id=[0-9]+' "$LOG" | sort -u | wc -l)
          echo "distinct cats.loader.id values: $LOADER_IDS"
          [ "$LOADER_IDS" -ge 2 ] || {
            echo "ERROR: expected ≥2 distinct cats classloader ids — mods are sharing a loader"
            grep '\[mcdp-smoke\]' "$LOG"
            exit 1
          }
          CLASS_IDS=$(grep -oE 'cats\.Functor\.class\.id=[0-9]+' "$LOG" | sort -u | wc -l)
          [ "$CLASS_IDS" -ge 2 ] || {
            echo "ERROR: expected ≥2 distinct cats.Functor.class ids"
            grep '\[mcdp-smoke\]' "$LOG"
            exit 1
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: version-iso-fabric
          path: |
            version-iso-fabric.log
            test-mods/fabric-example/run/logs/**
            test-mods/fabric-example/run/crash-reports/**
            test-mods/*/build/mcdepprovider/META-INF/*.toml
          if-no-files-found: ignore

  # ModContainer-in-ctor smoke (ADR-0017).
  #
  # kotlin-example's @Mod entry is `class ExampleMod(IEventBus, ModContainer, Dist)`. The
  # constructor's init block prints `[mcdp-smoke] mod=kotlin_example ... container.modId=...
  # dist=...`. After runServer reaches first tick, we grep the log to confirm the
  # modContainer arg threaded through to the entry constructor with the expected modId, and
  # that FMLEnvironment.dist plumbed through too. This proves McdpModContainer.constructMod
  # built the bag correctly under live FML — vanilla-parity lifecycle.
  modcontainer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts', 'settings.gradle.kts', '*/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Minecraft assets (neoforge)
        uses: actions/cache@v4
        with:
          path: |
            ~/.neoforge
          key: mc-assets-${{ runner.os }}-neoforge-1.21.1
          restore-keys: |
            mc-assets-${{ runner.os }}-neoforge-

      - name: Build mcdepprovider (publishes to composite build)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Boot kotlin-example NeoForge server
        working-directory: test-mods/kotlin-example
        shell: bash
        run: |
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 900 \
            --log-file ../../modcontainer-kotlin.log

      - name: Assert ModContainer + Dist plumbed through to mod ctor
        shell: bash
        run: |
          set -euo pipefail
          LOG=modcontainer-kotlin.log
          test -f "$LOG" || { echo "log missing"; exit 1; }
          grep '\[mcdp-smoke\]' "$LOG" | head -5
          grep -q 'container\.modId=kotlin_example' "$LOG" || {
            echo "ERROR: ModContainer not threaded through to ctor (expected container.modId=kotlin_example)"
            grep '\[mcdp-smoke\]' "$LOG" || true
            exit 1
          }
          grep -qE 'dist=(CLIENT|DEDICATED_SERVER)' "$LOG" || {
            echo "ERROR: Dist not threaded through (expected dist=CLIENT or dist=DEDICATED_SERVER)"
            grep '\[mcdp-smoke\]' "$LOG" || true
            exit 1
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: modcontainer-kotlin
          path: |
            modcontainer-kotlin.log
            test-mods/kotlin-example/run/logs/**
            test-mods/kotlin-example/run/crash-reports/**
          if-no-files-found: ignore

  # Mixin codegen smoke (ADR-0018).
  #
  # mixin-example is a Fabric mod whose 6 server-side mixins call into mod-private Java
  # helpers. The Gradle plugin's auto-codegen rewrites each @Inject body to dispatch through
  # a generated bridge interface (loaded parent-first via the auto-added bridge package) and
  # a per-mod forwarding impl (loaded by the mod's ModClassLoader). This job boots the
  # server and asserts every mixin handler fired — proving the codegen output verifies under
  # Sponge Mixin's transformer + the per-mod loader contract end-to-end.
  #
  # Linux-only — the codegen is pure JVM bytecode, mirrors of the Tier-2 runserver-smoke
  # already cover the Windows path classloading shape.
  mixin-codegen-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle.kts', 'settings.gradle.kts', '*/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Minecraft assets (fabric)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
          key: mc-assets-${{ runner.os }}-fabric-1.21.1
          restore-keys: |
            mc-assets-${{ runner.os }}-fabric-

      - name: Build mcdepprovider (publishes to composite build)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Build mixin-example and assert codegen artifacts present
        working-directory: test-mods/mixin-example
        shell: bash
        run: |
          set -euo pipefail
          ../../gradlew build --no-daemon --stacktrace

          # The codegen task must have run and produced a report listing rewrites.
          REPORT=build/mcdp-bridges/report.txt
          test -f "$REPORT" || { echo "codegen report missing at $REPORT"; exit 1; }
          cat "$REPORT"
          grep -q 'rewritten mixins (8)' "$REPORT" || {
            echo "ERROR: expected report to list 8 rewritten mixins"; exit 1; }

          # The remapped mod jar must contain bridge classes + the unified TOML manifest.
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          test -f "$JAR" || { echo "no jar built"; exit 1; }
          # Bridge interfaces live in <bridgePackage>/, impls in the sibling
          # <bridgePackage>_impl/ (ADR-0018 errata, ADR-0021).
          BRIDGE_ENTRIES=$(unzip -l "$JAR" | grep -E 'mcdp_bridges/.*Bridge\.class$' | wc -l)
          IMPL_ENTRIES=$(unzip -l "$JAR" | grep -E 'mcdp_bridges_impl/.*BridgeImpl\.class$' | wc -l)
          # Single-file TOML manifest (ADR-0019); content scanned for [[bridge]] count.
          unzip -l "$JAR" | grep -q 'META-INF/mcdp-bridges\.toml' || {
            echo "ERROR: META-INF/mcdp-bridges.toml missing from jar"; exit 1; }
          BRIDGE_TOML_COUNT=$(unzip -p "$JAR" META-INF/mcdp-bridges.toml | grep -c '^\[\[bridge\]\]')
          echo "bridge interfaces=$BRIDGE_ENTRIES impls=$IMPL_ENTRIES toml-bridges=$BRIDGE_TOML_COUNT"
          [ "$BRIDGE_ENTRIES" -ge 2 ] || { echo "expected ≥2 bridge interfaces"; exit 1; }
          [ "$IMPL_ENTRIES" -ge 2 ] || { echo "expected ≥2 bridge impls"; exit 1; }
          # 8 rewritten mixins; MultiTargetMixin contributes 2 entries → 9 total.
          [ "$BRIDGE_TOML_COUNT" -ge 9 ] || { echo "expected ≥9 [[bridge]] entries (8 mixins + MultiTargetMixin's second target)"; exit 1; }

      - name: Boot mixin-example fabric server
        working-directory: test-mods/mixin-example
        shell: bash
        run: |
          python3 ../../scripts/mc_smoke.py \
            --cwd . \
            --task :runServer \
            --timeout 900 \
            --log-file ../../mixin-codegen.log

      - name: Assert all 9 mixin markers + boot line fired
        shell: bash
        run: |
          set -euo pipefail
          LOG=mixin-codegen.log
          test -f "$LOG" || { echo "log missing"; exit 1; }
          echo "=== [mcdp-smoke] lines ==="
          grep '\[mcdp-smoke\]' "$LOG" | sort -u

          grep -q 'mod=mixin_example boot ok' "$LOG" || {
            echo "ERROR: entrypoint did not boot (no boot ok line)"; exit 1; }

          # BlocksClinitMixin fires during server init (before tick) — catches the empty-registry
          # bug from the mc-fluid-physics report. MultiTargetMixinA/B are emitted from a single
          # mixin body that calls into two mod-private types — catches the multi-[[bridge]] case.
          MISSING=0
          for n in MinecraftServerOneMixin MinecraftServerTwoMixin MinecraftServerThreeMixin \
                   MinecraftServerFourMixin MinecraftServerFiveMixin MinecraftServerSixMixin \
                   BlocksClinitMixin MultiTargetMixinA MultiTargetMixinB; do
            if ! grep -q "mixin=$n ok" "$LOG"; then
              echo "ERROR: mixin marker missing for $n"
              MISSING=1
            fi
          done
          [ "$MISSING" = 0 ] || exit 1

          # Defensive: any of these in the log indicates the codegen produced bytecode
          # the runtime rejected, or the bridge wiring failed.
          for pat in 'NoClassDefFoundError' 'IllegalAccessError' 'VerifyError' \
                     'mcdepprovider:.*not found'; do
            if grep -E "$pat" "$LOG"; then
              echo "ERROR: forbidden pattern '$pat' in log"; exit 1
            fi
          done

      - name: Upload logs + codegen report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mixin-codegen
          path: |
            mixin-codegen.log
            test-mods/mixin-example/run/logs/**
            test-mods/mixin-example/run/crash-reports/**
            test-mods/mixin-example/build/mcdp-bridges/**
          if-no-files-found: ignore
