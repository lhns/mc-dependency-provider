# Gradle 9.7.1 — NOT the repo-root 8.11.1. See
# ../fabric-example-26.3/gradle/wrapper/gradle-wrapper.properties for the full rationale.
#
# For THIS mod the binding constraint is only the daemon JVM: MC 26.x needs Java 25, and
# Gradle 8.11.1 cannot run on JDK 25. ModDevGradle 2.0.147 itself requires just Gradle >= 8.8
# and a daemon Java >= 17, and resolves the run/compile JVM through toolchains — it has no
# Loom-style daemon-JVM check. We pin the same 9.7.1 as the Fabric 26.3 cell so the two 26.x
# cells share one downloaded distribution.
#
# `gradlew`, `gradlew.bat` and `gradle/wrapper/gradle-wrapper.jar` are committed here; they
# are version-agnostic bootstrappers that read `distributionUrl` below.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
