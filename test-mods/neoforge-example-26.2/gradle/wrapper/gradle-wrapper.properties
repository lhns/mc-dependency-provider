# Gradle 9.6.1 — NOT the repo-root 8.11.1. See settings.gradle.kts and
# ../fabric-example-26.3/gradle/wrapper/gradle-wrapper.properties for the full rationale
# and for how to obtain the wrapper binaries (which are deliberately not committed).
#
# ModDevGradle 2.0.147 publishes Java-8 bytecode, so it loads on any daemon; the 9.6
# requirement here comes from the JDK 25 daemon MC 26.x needs, not from MDG.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
