# Gradle 9.7.1 — NOT the repo-root 8.11.1.
#
# Two independent constraints force 9.x here, and one of them forces >= 9.7.0 specifically:
#
#   1. Loom 1.18.x (1.18.0-alpha.23, 1.18.1, 1.18.2) publishes `runtimeElements` with
#      `org.gradle.plugin.api-version = 9.7.0` and `org.gradle.jvm.version = 25`. A Gradle
#      older than 9.7.0 is rejected at *variant selection* — the plugin will not even
#      resolve. So 9.6.1 (what this file used to pin, with a comment claiming it was
#      "verified" — it never was, no build had been run) cannot work. 9.7.0 is the floor;
#      9.7.1 is the current release and what we pin.
#   2. MC 26.x declares `javaVersion.majorVersion = 25`, and Loom's
#      `MinecraftProvider#verifyJavaVersion` compares that against `JavaVersion.current()`
#      of the *Gradle daemon*. So this build also needs a JDK 25 daemon (CI sets
#      `daemon_jdk: "25"` for this cell); Gradle 8.11.1 cannot run on JDK 25 at all.
#
# The repo root stays on 8.11.1: ForgeGradle 6.0.54's `EnvironmentChecks.checkEnvironment`
# accepts Gradle [8.1, 9.0) only, and `forge-example-1.20` / `-1.19` composite-include the
# root build. This mod does NOT composite-include `../..` (see settings.gradle.kts), so it
# is free to carry its own distribution.
#
# `gradlew`, `gradlew.bat` and `gradle/wrapper/gradle-wrapper.jar` ARE committed here, as
# in `forge-example-1.17` / `-1.18`. They are version-agnostic bootstrappers: they read
# `distributionUrl` below and download whatever it names. (The three committed wrapper jars
# in this repo are byte-identical yet launch 7.6, 8.11.1 and — here — 9.7.1.) No local
# Gradle 9.x install is needed to produce them.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
