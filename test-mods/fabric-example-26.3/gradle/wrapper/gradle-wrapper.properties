# Gradle 9.6.1 — NOT the repo-root 8.11.1.
#
# MC 26.x needs a JDK 25 Gradle daemon (see settings.gradle.kts), and Gradle 8.11.1 cannot
# run on JDK 25 at all. 9.6.1 is the oldest 9.x line verified to accept Loom 1.18.x's
# `org.gradle.jvm.version = 25` variant; 9.7.1 is current if you prefer to track latest.
#
# NOTE FOR CI / FIRST CHECKOUT: `gradle/wrapper/gradle-wrapper.jar`, `gradlew` and
# `gradlew.bat` are intentionally NOT committed here — they are binaries that cannot be
# produced without a local Gradle 9.6 install. Regenerate them once with either
#
#     gradle wrapper --gradle-version 9.6.1          # any Gradle >= 8 on the PATH
#
# or, in GitHub Actions, drop the wrapper entirely for this cell and use
#
#     - uses: gradle/actions/setup-gradle@v4
#       with: { gradle-version: "9.6.1" }
#
# and invoke `gradle` instead of `./gradlew`. The `forge-example-1.17` / `-1.18` precedent
# committed their wrapper jar because Gradle 7.6 wrappers were already in the tree; there is
# no such source here.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
