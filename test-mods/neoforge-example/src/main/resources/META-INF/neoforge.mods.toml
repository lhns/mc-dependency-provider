modLoader = "mcdepprovider"
loaderVersion = "[1,)"
license = "Apache-2.0"
issueTrackerURL = "https://gitea.lhns.de/lhns/mc-dependency-provider/issues"

[[mods]]
modId = "neoforge_example"
version = "${version}"
displayName = "MC Dependency Provider NeoForge example"
description = "Smoke-test mod that exercises the MC Dependency Provider Scala entrypoint + Maven dep resolution path on NeoForge."
authors = "MC Dependency Provider contributors"

[[dependencies.neoforge_example]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.neoforge_example]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# The whole NeoForge-side mixin registration. FML's ModFileParser reads this block out of
# neoforge.mods.toml and hands it to Mixin itself, and mcdp's McdpLanguageLoader re-reads the
# same block through IConfigurable to map every class the config names back to this modId.
# Nothing else registers it: no jar-manifest attribute, no --mixin.config run argument — which
# is exactly where Forge 1.20 differs (see test-mods/forge-example-1.20/build.gradle.kts).
[[mixins]]
config = "neoforge_example.mixins.json"
